<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teovox Agro — Marketing Estratégico para Agronegócio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-escuro:#16321f;
    --verde:#2f5233;
    --verde-claro:#4a7a3f;
    --dourado:#c99a3f;
    --dourado-claro:#e8c77a;
    --creme:#f0f0f0;
    --branco:#ffffff;
    --texto:#2a2a24;
    --texto-claro:#5c5c52;
    --max-width:1100px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Roboto', sans-serif;
    font-weight:400;
    color:var(--texto);
    background:var(--creme);
    line-height:1.6;
  }
  img{max-width:100%;display:block;}
  a{text-decoration:none;color:inherit;}
  .wrap{max-width:var(--max-width);margin:0 auto;padding:0 24px;}
  section{padding:80px 0;}
  h1,h2,h3{line-height:1.25;color:var(--verde-escuro);font-weight:700;}
  h1{font-size:2.6rem;}
  h2{font-size:2rem;margin-bottom:20px;}
  h3{font-size:1.2rem;}
  p{margin-bottom:16px;color:var(--texto-claro);font-weight:400;}
  .sub, .intro p, p.center{font-weight:500;}
  .btn{
    display:inline-block;
    background:var(--dourado);
    color:var(--verde-escuro);
    font-weight:700;
    padding:16px 32px;
    border-radius:6px;
    font-size:1.05rem;
    transition:background .2s, transform .2s;
    border:none;
    cursor:pointer;
  }
  .btn:hover{background:var(--dourado-claro);transform:translateY(-2px);}
  .btn-outline{
    display:inline-block;
    border:2px solid var(--branco);
    color:var(--branco);
    padding:12px 28px;
    border-radius:6px;
    font-weight:600;
  }
  .center{text-align:center;}

  /* HERO */
  .hero{
    position:relative;
    z-index:1;
    overflow:hidden;
    color:var(--branco);
    padding:0 0 80px;
  }
  .hero-bg{
    position:absolute;
    top:-30%;left:0;right:0;
    height:160%;
    background:
      linear-gradient(100deg, rgba(10,20,12,.55) 0%, rgba(10,20,12,.25) 45%, rgba(10,20,12,0) 70%),
      url('IMAGENS/slider-01d.png') center/cover no-repeat;
    z-index:-1;
    will-change:transform;
  }

  /* CABEÇALHO DO SITE */
  .site-header{position:relative;z-index:2;}
  .site-header-inner{
    max-width:1300px;margin:0 auto;padding:24px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
  }
  .site-logo img{height:30px;display:block;}
  .site-nav{display:flex;gap:44px;}
  .site-nav a{
    position:relative;
    color:var(--branco);
    font-size:.95rem;
    font-weight:300;
    padding-bottom:10px;
  }
  .site-nav a::after{
    content:"";
    position:absolute;
    left:0;bottom:0;
    width:100%;height:3px;
    border-radius:2px;
    background:#c0d73e;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .site-nav a:hover::after{opacity:1;transform:translateY(0);}
  .whatsapp-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:#25D366;color:var(--branco);
    padding:10px 18px;border-radius:30px;
    font-size:.85rem;font-weight:700;white-space:nowrap;
  }
  .whatsapp-btn svg{width:18px;height:18px;fill:var(--branco);}
  .whatsapp-btn:hover{background:#1fb958;}
  @media(max-width:700px){
    .site-nav{display:none;}
  }
  .plus-field{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .plus-field .plus{
    position:absolute;
    color:rgba(255,255,255,.6);
    font-size:1.8rem;
    font-weight:400;
    line-height:1;
    transition:transform .5s ease-out;
    will-change:transform;
  }
  .hero .plus-field .plus{
    width:42px;height:42px;
    display:flex;align-items:center;justify-content:center;
    opacity:.2;
  }
  .hero .plus-field .plus svg{
    width:28px;height:28px;
    fill:none;
    stroke:var(--verde);
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .hero .btn.hero-btn{background:#c0d73e;}
  .hero .btn.hero-btn:hover{background:#cfe266;}
  .hero .wrap{position:relative;z-index:1;max-width:1300px;text-align:left;margin-top:36px;}

  @keyframes heroEnter{
    from{opacity:0;transform:translateX(-40px);}
    to{opacity:1;transform:translateX(0);}
  }
  .hero h1,
  .hero .sub,
  .hero ul li,
  .hero .hero-btn{
    animation:heroEnter 3s cubic-bezier(.16,1,.3,1) both;
  }
  .hero h1{animation-delay:.05s;}
  .hero .sub{animation-delay:.2s;}
  .hero ul li:nth-child(1){animation-delay:.35s;}
  .hero ul li:nth-child(2){animation-delay:.45s;}
  .hero ul li:nth-child(3){animation-delay:.55s;}
  .hero .hero-btn{animation-delay:.7s;}

  .hero h1{color:var(--branco);font-size:3.4rem;margin-bottom:14px;}
  .hero .sub{color:rgba(255,255,255,.9);font-size:1.15rem;max-width:100%;margin:0 0 24px;}
  .hero ul{list-style:none;text-align:left;max-width:640px;margin:0 0 36px;}
  .hero li{
    padding:12px 0 12px 32px;
    position:relative;
    color:var(--branco);
    border-bottom:1px solid rgba(255,255,255,.2);
  }
  .hero li strong{font-weight:800;color:#c0d73e;}
  .hero li small{display:block;font-weight:400;font-size:1em;font-family:inherit;}
  .hero li:before{
    content:"✓";
    position:absolute;left:0;top:12px;
    color:var(--dourado-claro);
    font-weight:800;
  }
  /* DOR */
  .dor{background:var(--branco);}
  .dor .wrap{max-width:760px;text-align:center;}
  .dor h2{color:var(--verde-escuro);}

  /* CTA intermediário */
  .cta-mid{
    position:relative;
    overflow:hidden;
    background:var(--dourado);
    color:var(--verde-escuro);
    text-align:center;
    padding:60px 0;
  }
  .cta-bg{
    position:absolute;
    top:-30%;left:0;right:0;
    height:160%;
    background:url('IMAGENS/slider-soja.jpg') center 70%/cover no-repeat;
    opacity:.15;
    z-index:0;
    will-change:transform;
  }
  .cta-mid .wrap{position:relative;z-index:1;}
  .cta-mid h2{color:var(--verde-escuro);}
  .cta-mid .btn{background:var(--verde-escuro);color:var(--branco);}
  .cta-mid .btn:hover{background:var(--verde);}

  /* ÍCONE DE PAINEL (título) */
  .panel-icon-badge{
    width:52px;height:52px;
    border-radius:50%;
    background:var(--verde);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 14px;
  }
  .panel-icon-badge svg{
    width:26px;height:26px;
    fill:none;
    stroke:var(--branco);
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* ANIMAÇÃO DE ENTRADA (uma única vez) */
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease, transform .7s ease;}
  .reveal.reveal-in{opacity:1;transform:translateY(0);}

  /* MÉTODO */
  .metodo{background:var(--creme);}
  .metodo .wrap{max-width:900px;}
  .metodo .intro{max-width:700px;margin:0 auto 40px;text-align:center;}
  .pilares{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;}
  .pilar{
    background:var(--branco);
    border-radius:6px;
    padding:28px 24px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
    border-bottom:4px solid #c0d73e;
  }
  .pilar h3{color:rgba(0,0,0,.97);margin-bottom:8px;font-size:1.05rem;}
  .pilar p{margin-bottom:0;font-size:.95rem;}
  .metodo .closing{text-align:center;font-weight:600;color:var(--verde-escuro);margin-top:32px;}

  /* PARA QUEM */
  .publico{background:#fafafa;}
  .publico h2{font-size:2.6rem;}
  .publico-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
  .publico-col{padding:28px;border-radius:8px;background:var(--branco);border:1px solid #e4e4e4;}
  .publico-col h3{
    display:flex;align-items:center;gap:10px;
    margin-bottom:16px;
    font-size:1.35rem;
    font-weight:800;
  }
  .publico-col h3 svg{width:26px;height:26px;flex-shrink:0;}
  .publico-col.sim h3{color:var(--verde);}
  .publico-col.sim h3 svg{stroke:var(--verde);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .publico-col.nao h3{color:#c0392b;}
  .publico-col.nao h3 svg{stroke:#c0392b;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .publico-col ul{list-style:none;}
  .publico-col li{padding:8px 0;font-size:.97rem;color:var(--texto);}

  /* ENTREGÁVEIS */
  .entregaveis{position:relative;overflow:hidden;background:var(--creme);}
  .entregaveis-bg{
    position:absolute;
    top:-30%;left:0;right:0;
    height:160%;
    background:url('IMAGENS/background-office-agro.png') center/cover no-repeat;
    opacity:.25;
    z-index:0;
    will-change:transform;
  }
  .entregaveis .wrap{position:relative;z-index:1;}
  .entrega-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;margin-top:30px;}
  .entrega-card{background:var(--branco);border-radius:8px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.04);}
  .entrega-card h3{color:var(--verde-escuro);margin-bottom:12px;font-size:1.05rem;text-align:center;}
  .entrega-card ul{list-style:none;}
  .entrega-card li{
    padding:6px 0 6px 22px;
    position:relative;
    font-size:.92rem;
    color:var(--texto-claro);
  }
  .entrega-card li:before{content:"•";position:absolute;left:0;color:var(--dourado);font-weight:800;}

  /* BÔNUS */
  .bonus{position:relative;overflow:hidden;background:var(--verde-escuro);color:var(--branco);}
  .bonus .wrap{position:relative;z-index:1;max-width:760px;text-align:center;}
  .bonus h2{color:var(--dourado-claro);}
  .bonus p{color:#d8e4d3;}
  .bonus-box{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    border-radius:8px;
    padding:28px;
    margin-top:20px;
    text-align:left;
  }
  .bonus .plus-field .plus{
    display:flex;align-items:center;justify-content:center;
    opacity:.6;
  }
  .bonus .plus-field .plus svg{
    fill:none;stroke:var(--branco);stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .bonus .plus-field .plus.plus-md{width:44px;height:44px;}
  .bonus .plus-field .plus.plus-md svg{width:36px;height:36px;}
  .bonus .plus-field .plus.plus-sm{width:26px;height:26px;}
  .bonus .plus-field .plus.plus-sm svg{width:20px;height:20px;}

  /* STACK DE VALOR */
  .stack{background:var(--branco);}
  .stack .wrap{max-width:1040px;}
  .stack-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;text-align:left;}
  .stack-text h2{text-align:left;}
  .stack-block{
    background:var(--creme);
    border:1px solid #e4e4e4;
    border-radius:10px;
    padding:28px;
  }
  .stack-list{list-style:none;margin:0;}
  .stack-list li{
    display:flex;
    justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid #e5e0d3;
    font-weight:600;
    color:var(--verde-escuro);
  }
  .stack-list li:last-child{border-bottom:none;padding-bottom:0;}
  .stack-list span:last-child{color:var(--texto-claro);font-weight:400;}
  @media(max-width:800px){
    .stack-grid{grid-template-columns:1fr;}
  }

  /* RESULTADOS */
  .resultados{background:var(--creme);}
  .resultado-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:30px;}
  .resultado-card{
    background:var(--branco);
    border-radius:8px;
    padding:26px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
  }
  .resultado-card h3{color:var(--dourado);font-size:1.1rem;margin-bottom:10px;}
  .resultado-card p{font-size:.92rem;margin-bottom:0;}

  /* SUPORTE */
  .suporte{background:var(--branco);}
  .suporte .wrap{max-width:1040px;}
  .suporte-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;text-align:left;}
  .suporte-grid h2, .suporte-grid p.center{text-align:left;}
  .suporte-grid img{width:100%;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);}
  .suporte ul{list-style:none;margin-top:20px;}
  .suporte li{
    padding:12px 0 12px 32px;
    position:relative;
    border-bottom:1px solid #ece7d8;
  }
  .suporte li:before{content:"→";position:absolute;left:0;color:var(--verde);font-weight:800;}
  .suporte strong{color:var(--verde-escuro);}
  @media(max-width:800px){
    .suporte-grid{grid-template-columns:1fr;}
  }

  /* GARANTIA */
  .garantia{background:var(--verde);color:var(--branco);}
  .garantia .wrap{max-width:700px;text-align:center;}
  .garantia h2{color:var(--branco);}
  .garantia h2 .destaque{color:#ffde00;}
  .garantia p{color:#e4ecdf;}

  /* AUTORIDADE */
  .autoridade{background:var(--creme);}
  .autoridade .wrap{max-width:900px;}
  .autoridade-grid{display:grid;grid-template-columns:280px 1fr;gap:40px;align-items:center;text-align:left;}
  .autoridade-grid img{width:100%;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);}
  .autoridade-grid .autoridade-text p:last-child{margin-bottom:0;}
  @media(max-width:700px){
    .autoridade-grid{grid-template-columns:1fr;text-align:center;}
    .autoridade-grid img{max-width:220px;margin:0 auto;}
  }

  /* FAQ */
  .faq{background:var(--branco);}
  .faq .wrap{max-width:760px;}
  details{
    border-bottom:1px solid #e5e0d3;
    padding:18px 0;
  }
  details summary{
    font-weight:700;
    color:var(--verde-escuro);
    cursor:pointer;
    list-style:none;
    position:relative;
    padding-right:30px;
  }
  details summary::-webkit-details-marker{display:none;}
  details summary:after{
    content:"+";
    position:absolute;right:0;top:0;
    font-size:1.3rem;
    color:var(--dourado);
  }
  details[open] summary:after{content:"–";}
  details p{margin-top:12px;margin-bottom:0;}

  /* OFERTA FINAL */
  .oferta{
    background:linear-gradient(160deg, var(--verde-escuro), var(--verde) 70%);
    color:var(--branco);
    text-align:center;
  }
  .oferta .wrap{max-width:780px;}
  .oferta h2{color:var(--branco);}
  .oferta .lead{color:var(--branco);}
  .escolhas{display:grid;grid-template-columns:1fr 1fr;gap:20px;text-align:left;margin:32px 0;}
  .escolha{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    border-radius:8px;
    padding:26px 22px;
    text-align:center;
  }
  .escolha .panel-icon-badge{background:var(--dourado);}
  .escolha h3{color:var(--dourado-claro);margin-bottom:10px;font-size:1rem;}
  .escolha p{color:#d8e4d3;font-size:.92rem;margin-bottom:0;text-align:left;}

  footer{
    background:var(--verde-escuro);
    color:#a9b8a3;
    text-align:center;
    padding:32px 0;
    font-size:.9rem;
  }

  /* MOUSE TRAIL */
  .cursor-dot,.cursor-glow{
    position:fixed;
    top:0;left:0;
    border-radius:50%;
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%);
    will-change:transform;
  }
  .cursor-dot{
    width:8px;height:8px;
    background:var(--dourado);
  }
  .cursor-glow{
    width:36px;height:36px;
    background:radial-gradient(circle, rgba(201,154,63,.5), rgba(201,154,63,0) 70%);
  }
  @media (hover:none), (pointer:coarse){
    .cursor-dot,.cursor-glow{display:none;}
  }

  @media(max-width:700px){
    h1{font-size:2.2rem;}
    h2{font-size:1.5rem;}
    .publico-grid, .escolhas{grid-template-columns:1fr;}
    section{padding:56px 0;}
  }
</style>
</head>
<body>

  <symbol id="icon-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15
